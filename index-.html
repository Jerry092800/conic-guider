        function compressImage(dataUrl, maxSize, quality, callback) {
            const img = new Image();
            img.onload = () => {
                let { width, height } = img;
                if (width > height) {
                    if (width > maxSize) { height = Math.round(height * maxSize / width); width = maxSize; }
                } else {
                    if (height > maxSize) { width = Math.round(width * maxSize / height); height = maxSize; }
                }
                const canvas = document.createElement("canvas");
                canvas.width = width; canvas.height = height;
                canvas.getContext("2d").drawImage(img, 0, 0, width, height);
                let out = canvas.toDataURL("image/webp", quality);
                if (!out.startsWith("data:image/webp")) out = canvas.toDataURL("image/jpeg", quality);
                callback(out);
            };
            img.onerror = () => alert("图片读取失败");
            img.src = dataUrl;
        }

        function linkifyPeople(container) {
            const walker = document.createTreeWalker(container, NodeFilter.SHOW_TEXT);
            const textNodes = [];
            let node;
            while (node = walker.nextNode()) textNodes.push(node);
            const keys = Object.keys(PEOPLE).sort((a, b) => b.length - a.length);
            textNodes.forEach(textNode => {
                const text = textNode.nodeValue;
                if (!text) return;
                const hasMatch = keys.some(key => key.length >= 2 && text.indexOf(key) !== -1);
                if (!hasMatch) return;
                const fragment = document.createDocumentFragment();
                let remaining = text;
                let guard = 0;
                while (remaining && guard++ < 50) {
                    let earliestIdx = -1, earliestKey = null;
                    keys.forEach(key => {
                        if (key.length < 2) return;
                        const idx = remaining.indexOf(key);
                        if (idx !== -1 && (earliestIdx === -1 || idx < earliestIdx)) {
                            earliestIdx = idx; earliestKey = key;
                        }
                    });
                    if (earliestIdx === -1) {
                        fragment.appendChild(document.createTextNode(remaining));
                        break;
                    }
                    if (earliestIdx > 0) fragment.appendChild(document.createTextNode(remaining.slice(0, earliestIdx)));
                    const link = document.createElement("span");
                    link.className = "person-link";
                    link.textContent = earliestKey;
                    link.onclick = () => openPersonCard(earliestKey);
                    fragment.appendChild(link);
                    remaining = remaining.slice(earliestIdx + earliestKey.length);
                }
                textNode.parentNode.replaceChild(fragment, textNode);
            });
        }

        function parseAndDraw(text) {

            if (m2) { runGGB2D(m2[1]); switchTab("2d"); }
            return text
                .replace(/\[GGB_CMD\][\s\S]*?\[\/GGB_CMD\]/g, '')
                .replace(/\[GGB3D_CMD\][\s\S]*?\[\/GGB3D_CMD\]/g, '')
                .trim();

        function isPureEquation(text) {
            text = text.trim();
            if (!text || text.length > 200) return false;
            if (/[\u4e00-\u9fa5]/.test(text)) return false;
            if (/[？?！!]/.test(text)) return false;
            return /=|x|y|z|\^|\/|\+|\-|\*|sin|cos|tan|sqrt|pi/i.test(text);
        }

            async function getAIResponseStream(userMessage, onDelta) {
            // 把最近的对话历史 + 当前问题一起发给 AI
            const historyMessages = chatHistory.slice(-6).map(m => ({
                role: m.role === "assistant" ? "assistant" : "user",
                content: m.content,
                content_type: "text"
            }));

            const body = {
                bot_id: COZE_BOT_ID,
                user_id: "student_001",
                stream: true,
                auto_save_history: true,
                additional_messages: [
                    ...historyMessages,
                    { role: "user", content: userMessage, content_type: "text" }
                ]
            };
            // 不再传 conversation_id，每次都用完整历史
            const resp = await fetch("https://api.coze.cn/v3/chat", {
                method: "POST",
                headers: {
                    "Authorization": "Bearer " + COZE_TOKEN,
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(body)
            });
            if (!resp.ok) throw new Error("HTTP " + resp.status);
            const reader = resp.body.getReader();
            const decoder = new TextDecoder("utf-8");
            let buffer = "", fullText = "", eventType = "";
            while (true) {
                const { done, value } = await reader.read();
                if (done) break;
                buffer += decoder.decode(value, { stream: true });
                const lines = buffer.split("\n");
                buffer = buffer.split("\n").pop();
                for (const line of lines) {
                    const t = line.trim();
                    if (t.startsWith("event:")) eventType = t.slice(6).trim();
                    else if (t.startsWith("data:")) {
                        const d = t.slice(5).trim();
                        if (d === "" || d === "[DONE]") continue;
                        try {
                            const json = JSON.parse(d);
                            if (eventType === "conversation.message.delta" && json.type === "answer" && json.content) {
                                onDelta(json.content);
                                fullText += json.content;
                            }
                        } catch (e) {}
                    }
                }
            }
            return fullText;
        }

        async function sendMessage() {
            const text = inputEl.value.trim();
            if (!text) return;
            inputEl.value = "";
            addMessage("user", text);

            if (isPureEquation(text) && /z|Surface/i.test(text)) {
                runGGB3D(text); switchTab("3d");
                addMessage("assistant", "已画出 3D 图形：\n$" + text + "$");
                return;
            }
            if (isPureEquation(text)) {
                runGGB2D(text); switchTab("2d");
                addMessage("assistant", "已画出：\n$" + text + "$");
                return;
            }

            sendBtn.disabled = true;
            const loadingMsg = addMessage("loading", "");
            let aiRow = null, aiBubble = null, fullReply = "";
            try {
                await getAIResponseStream(text, (delta) => {
                    if (!aiRow) {
                        loadingMsg.remove();
                        aiRow = document.createElement("div");
                        aiRow.className = "message-row assistant";
                        aiRow.innerHTML = `<div class="message-avatar" data-role="ai"></div>
                            <div class="message-bubble"></div>`;
                        messagesEl.appendChild(aiRow);
                        renderAvatarToEl(aiRow.querySelector(".message-avatar"), avatars.ai);
                        aiBubble = aiRow.querySelector(".message-bubble");
                    }
                    fullReply += delta;
                    const display = fullReply
                        .replace(/\[GGB_CMD\][\s\S]*?\[\/GGB_CMD\]/g, '')
                        .replace(/\[GGB3D_CMD\][\s\S]*?\[\/GGB3D_CMD\]/g, '');
                                                           let safeDisplay = display;
                    // 如果包含 $，说明正在生成公式，暂停在第一个 $ 之前
                    const firstDollar = safeDisplay.indexOf('$');
                    if (firstDollar !== -1) {
                        safeDisplay = safeDisplay.slice(0, firstDollar);
                    }
                    aiBubble.textContent = safeDisplay;
                    const cursor = document.createElement("span");
                    cursor.className = "streaming-cursor";
                    aiBubble.appendChild(cursor);
                    messagesEl.scrollTop = messagesEl.scrollHeight;
                });
                if (aiRow) {
                    const cursor = aiBubble.querySelector(".streaming-cursor");
                    if (cursor) cursor.remove();
                    parseAndDraw(fullReply);
                    const cleanText = fullReply
                        .replace(/\[GGB_CMD\][\s\S]*?\[\/GGB_CMD\]/g, '')
                        .replace(/\[GGB3D_CMD\][\s\S]*?\[\/GGB3D_CMD\]/g, '')
                        .trim();
                    aiBubble.textContent = cleanText;
                    linkifyPeople(aiBubble);
                    chatHistory.push({ role: "assistant", content: cleanText });
                    saveHistory();
                    if (window.MathJax && MathJax.typesetPromise) {
                        MathJax.typesetPromise([aiBubble]).catch(() => {});
                    }
                } else {
                    loadingMsg.remove();
                    addMessage("assistant", "AI 没有返回内容。");
                }
            } catch (e) {
                console.error(e);
                if (loadingMsg.parentNode) loadingMsg.remove();
                addMessage("assistant", "出错了：" + e.message);
            } finally {
                sendBtn.disabled = false;
                inputEl.focus();
            }
        }

        // ===================================================
                       // GeoGebra 初始化函数
        function initGGB() {
            try {
                console.log("[GGB] 开始初始化，GGBApplet 类型：", typeof GGBApplet);
                new GGBApplet(ggb2dParams, true).inject("ggb-container-2d");
                new GGBApplet(ggb3dParams, true).inject("ggb-container-3d");
                console.log("[GGB] inject 命令已发出");
            } catch (e) {
                console.error("[GGB] 初始化失败：", e);
            }
        }

        window.addEventListener("load", () => {
            loadTheme();
            loadAvatars();
            refreshAllAvatars();
            renderTimeline();
            updateSceneInfo();

            // 👇 初始化 GeoGebra
            initGGB();

            const saved = loadHistory();
            conversationId = saved.conversationId || "";
            chatHistory = saved.messages || [];

            if (chatHistory.length === 0) {
                showWelcome();
            } else {
                chatHistory.forEach(msg => {
                    addMessage(msg.role, msg.content);
                });
                chatHistory = saved.messages.slice();
                if (window.MathJax && MathJax.typesetPromise) {
                    MathJax.typesetPromise([messagesEl]).catch(() => {});
                }
            }
        });
    </script>
</body>
</html>
